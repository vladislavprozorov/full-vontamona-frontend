# Имя проекта намеренно не задаём: оно берётся из имени папки
# (full-vontamona-frontend). Задать своё — значит создать второй проект
# рядом со старым, со всеми контейнерами заново.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # Не публикуем наружу 3000 — наружу идём через Caddy (80/443)
    expose:
      - "3000"
    # Отсюда приложение берёт SMTP_* и TELEGRAM_* для формы заявок.
    # format: raw — пароли могут содержать $, который compose иначе съест.
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Хост db — имя сервиса базы в соседнем compose-проекте (репозиторий cruise-database).
      # Пароль берётся из .env рядом с этим файлом, в git он не хранится.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      # default обязателен явно: как только у сервиса появляется секция networks,
      # дефолтная сеть перестаёт подключаться сама — и Caddy потеряет frontend
      - default
      - cruise-net
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
    # format: raw обязателен. Bcrypt-хеш содержит $, и при обычном чтении .env
    # compose принимает $cSdLpyu... за переменную и подставляет пустую строку —
    # пароль на /admin тогда молча перестаёт работать.
    env_file:
      - path: .env
        format: raw
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  # Общая сеть с базой. Создаётся один раз: docker network create cruise-net
  cruise-net:
    external: true
